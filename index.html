<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dance Hall Hooligans | Official Website</title>
    <style>
        /* Reset and Base Styles */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: #0b0f0e; color: #f4f4f2; line-height: 1.6;
        }
        a { color: #dca642; text-decoration: none; transition: all 0.3s ease; }
        a:hover { color: #b30e16; }

        /* Navigation */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background-color: #060a09; position: sticky; top: 0; z-index: 100;
            border-bottom: 3px solid #b30e16; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .logo-box { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 60px; width: auto; object-fit: contain; }
        .logo-text { 
            font-size: 1.6rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; 
            color: #dca642; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .nav-links { list-style: none; display: flex; align-items: center; }
        .nav-links li { margin-left: 25px; }
        .nav-links a { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; color: #f4f4f2; }
        .nav-links a:hover, .nav-links a.active { color: #dca642; }

        /* Hero Container - Fluid Aspect Ratio Setup */
        .hero {
            position: relative;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9; 
            max-height: 75vh; 
            overflow: hidden;
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            align-items: center; 
            text-align: center;
            background-color: #060a09;
        }

        /* The Slider Canvas wrapper */
        .hero-slider {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* Individual Sliding Slide setup - Fluid fitting layout */
        .slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: contain; 
            background-position: center center;
            background-repeat: no-repeat;
            transform: translateX(100%);
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Dark overlay pinned strictly above the moving pictures, but below your text content */
        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(6, 10, 9, 0.2), rgba(11, 15, 14, 0.7)); 
            z-index: 2;
        }

        /* Hero Text & Button Content wrapper - Bottom centered layout */
        .hero-content {
            position: relative;
            z-index: 3;
            padding: 0 20px 40px 20px; 
            max-width: 800px;
            width: 100%;
        }
        
        .hero h1 { 
            font-size: 4rem; 
            text-transform: uppercase; 
            margin-bottom: 10px; 
            letter-spacing: 3px; 
            color: rgba(220, 166, 66, 0.5); 
            text-shadow: 3px 3px 0px rgba(179, 14, 22, 0.5), 5px 5px 15px rgba(0,0,0,0.6); 
        }
        
        .hero p { 
            font-size: 1.3rem; 
            margin-bottom: 25px; 
            color: rgba(203, 213, 208, 0.5); 
            font-style: italic; 
            text-shadow: 1px 1px 5px rgba(0,0,0,0.7); 
        }
        
        .btn {
            display: inline-block; background-color: #b30e16; color: #fff; padding: 12px 35px;
            border-radius: 3px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s ease; border: 1px solid #dca642; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:hover { background-color: #006351; color: #dca642; border-color: #b30e16; transform: translateY(-2px); }

        /* Slide Animation Utility Classes managed via JS */
        .slide.active { transform: translateX(0) !important; }
        .slide.exit-left { transform: translateX(-100%) !important; }
        .slide.exit-right { transform: translateX(100%) !important; }

        /* Main Content Container */
        .container { max-width: 1000px; margin: 0 auto; padding: 60px 20px; }
        section { 
            margin-bottom: 70px; background: #0e1412; padding: 40px; 
            border-radius: 6px; border: 1px solid #192420; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h2 { font-size: 2rem; text-transform: uppercase; border-bottom: 2px solid #dca642; padding-bottom: 10px; margin-bottom: 35px; letter-spacing: 2px; color: #b30e16; }

        /* Tour Dates Table Structure */
        .tour-table { width: 100%; border-collapse: collapse; }
        .tour-table tr { border-bottom: 1px solid #192420; transition: background 0.2s; }
        .tour-table tr:hover { background-color: rgba(220, 166, 66, 0.03); }
        .tour-table td { padding: 20px 10px; vertical-align: middle; }
        .tour-date { font-weight: bold; color: #dca642; width: 15%; font-size: 1.1rem; }
        .tour-venue { width: 45%; font-weight: 600; }
        .tour-location { width: 20%; color: #8ba196; }
        
        .tour-tickets { 
            width: 20%; 
            text-align: right; 
            min-width: 140px; 
        }
        
        .tour-tickets .btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 8px 10px;
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Media Player Wrapper */
        .audio-container { 
            background: #060a09; 
            padding: 30px; 
            border-radius: 8px; 
            text-align: center; 
            border: 1px solid #b30e16; 
        }

        /* About Layout */
        #about p { font-size: 1.15rem; line-height: 1.8; color: #cbd5d0; text-align: justify; }

        /* Footer */
        footer { background-color: #060a09; text-align: center; padding: 40px 20px; font-size: 0.9rem; color: #52665c; border-top: 2px solid #b30e16; }

        /* Responsive UI Framework Adjustments */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                gap: 15px;
                padding: 15px 2%;
            }
            
            .nav-links {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 15px;
                width: 100%;
            }
            
            .nav-links li {
                margin-left: 0;
            }

            .nav-links a {
                font-size: 0.95rem;
            }

            .hero { aspect-ratio: unset; height: 45vh; } 
            .hero h1 { font-size: 2.6rem; }
            .hero p { font-size: 1.1rem; }
            .hero-content { padding-bottom: 20px; }
            
            .tour-table td { display: block; width: 100%; padding: 8px 10px; }
            .tour-table tr { padding: 15px 0; display: block; }
            .tour-tickets { text-align: left; margin-top: 10px; width: 100%; max-width: 200px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo-box" id="logo-container"></a>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="songlist.html">Song List</a></li>
            <li><a href="reviews.html">Reviews</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="shop.html">Shop</a></li>
        </ul>
    </nav>

    <header class="hero" id="hero-section">
        <div class="hero-slider" id="slider-canvas"></div>
        <div class="hero-overlay"></div>
        
        <div class="hero-content">
            <h1>Dance Hall Hooligans</h1>
            <p>Bringing the noise, the riddim, and the energy straight to your town.</p>
            <a href="#tour" class="btn">SEE OUR LIVE DATES</a>
        </div>
    </header>

    <div class="container">
        <section id="tour">
            <h2>Upcoming Tour Dates</h2>
            <table class="tour-table" id="tour-list"></table>
        </section>

        <section id="music">
            <h2>Listen Now</h2>
            <div class="audio-container" id="music-container"></div>
        </section>

        <section id="about">
            <h2>About The Band</h2>
            <p id="about-text"></p>
        </section>
    </div>

    <footer>
        <p>© 2026 Dance Hall Hooligans. All rights reserved.</p>
    </footer>

    <script>
        // --- MASTER DATA & UI ENGINE LOADER ---
        fetch('data.json')
            .then(response => response.json())
            .then(data => {
                const dirs = data.directories || { logos: "", pics: "", graphics: "" };
                
                // 1. Render Logo Branding
                const logoContainer = document.getElementById('logo-container');
                let logoContent = "";
                if (data.logoFile && data.logoFile.trim() !== "") {
                    logoContent += `<img src="${dirs.logos}${data.logoFile}" alt="Logo" class="logo-img">`;
                }
                logoContent += `<span class="logo-text">Dance Hall Hooligans</span>`;
                logoContainer.innerHTML = logoContent;

                // 2. Render Tour Dates
                const tourList = document.getElementById('tour-list');
                if (!data.tourDates || data.tourDates.length === 0) {
                    tourList.innerHTML = "<tr><td>More dates coming soon!</td></tr>";
                } else {
                    data.tourDates.forEach(show => {
                        const keys = Object.keys(show);
                        const lastKey = keys[keys.length - 1];
                        const buttonLabel = show[lastKey];

                        tourList.innerHTML += `<tr>
                            <td class="tour-date">${show.date}</td>
                            <td class="tour-venue">${show.venue}</td>
                            <td class="tour-location">${show.location}</td>
                            <td class="tour-tickets">
                                <a href="#" class="btn">${buttonLabel}</a>
                            </td>
                        </tr>`;
                    });
                }

                // 3. Render Optimized Media Stream Core (Custom Widescreen Layout for YouTube Video)
                document.getElementById('music-container').innerHTML = `
                    <iframe 
                        src="${data.streamingEmbed}" 
                        width="100%" 
                        style="border:none; max-width:700px; aspect-ratio:16/9; margin:0 auto; display:block; border-radius:8px;" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                    </iframe>`;

                // 4. Render About Text Summary
                document.getElementById('about-text').innerText = data.aboutText;

                // 5. Initialize Automated Slide Engine
                initializeBackgroundSlider(dirs.pics);
            })
            .catch(error => console.error("Error loading master configurations:", error));


        // --- AUTOMATED PICTURE BUMPING BACKGROUND SLIDER LOGIC ---
        function initializeBackgroundSlider(picsDir) {
            const sliderCanvas = document.getElementById('slider-canvas');
            const checkedImages = [];
            let loadedCount = 0;
            const totalToTest = 10;

            for (let i = 1; i <= totalToTest; i++) {
                const img = new Image();
                const imgSrc = `${picsDir}${i}.webp`;
                
                img.onload = function() {
                    checkedImages.push(imgSrc);
                    checkVerificationProgress();
                };
                img.onerror = function() {
                    checkVerificationProgress();
                };
                img.src = imgSrc;
            }

            function checkVerificationProgress() {
                loadedCount++;
                if (loadedCount === totalToTest) {
                    checkedImages.sort((a, b) => {
                        const numA = parseInt(a.match(/(\d+)\.webp$/)[1]);
                        const numB = parseInt(b.match(/(\d+)\.webp$/)[1]);
                        return numA - numB;
                    });

                    if (checkedImages.length > 0) {
                        startSliderEngine(checkedImages);
                    }
                }
            }

            function startSliderEngine(validImages) {
                validImages.forEach((src) => {
                    const slideDiv = document.createElement('div');
                    slideDiv.className = 'slide';
                    slideDiv.style.backgroundImage = `url('${src}')`;
                    sliderCanvas.appendChild(slideDiv);
                });

                const slides = document.querySelectorAll('.slide');
                let currentIndex = 0;
                let directionFromLeft = true;

                slides[currentIndex].classList.add('active');

                if (validImages.length === 1) return;

                setInterval(() => {
                    const previousIndex = currentIndex;
                    currentIndex = (currentIndex + 1) % slides.length;

                    const currentSlide = slides[previousIndex];
                    const nextSlide = slides[currentIndex];

                    if (directionFromLeft) {
                        nextSlide.style.transform = 'translateX(-100%)';
                    } else {
                        nextSlide.style.transform = 'translateX(100%)';
                    }

                    nextSlide.offsetHeight;

                    nextSlide.classList.add('active');

                    if (directionFromLeft) {
                        currentSlide.className = 'slide exit-right';
                    } else {
                        currentSlide.className = 'slide exit-left';
                    }

                    setTimeout(() => {
                        currentSlide.className = 'slide';
                    }, 1200);

                    directionFromLeft = !directionFromLeft;
                }, 5000); 
            }
        }
    </script>
</body>
</html>
