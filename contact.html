<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Dance Hall Hooligans</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Georgia', 'Times New Roman', serif; background-color: #0b0f0e; color: #f4f4f2; line-height: 1.6; }
        a { color: #dca642; text-decoration: none; transition: all 0.3s ease; }
        a:hover { color: #b30e16; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background-color: #060a09; position: sticky; top: 0; z-index: 100; border-bottom: 3px solid #b30e16; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .logo-box { display: flex; align-items: center; gap: 15px; }
        .logo-img { height: 60px; width: auto; object-fit: contain; }
        .logo-text { font-size: 1.6rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; color: #dca642; }
        .nav-links { list-style: none; display: flex; align-items: center; }
        .nav-links li { margin-left: 25px; }
        .nav-links a { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; color: #f4f4f2; }
        .nav-links a:hover, .nav-links .active { color: #dca642; }
        
        .container { max-width: 700px; margin: 0 auto; padding: 60px 20px; }
        section { background: #0e1412; padding: 40px; border-radius: 6px; border: 1px solid #192420; box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 40px; }
        h2 { font-size: 2rem; text-transform: uppercase; border-bottom: 2px solid #dca642; padding-bottom: 10px; margin-bottom: 35px; letter-spacing: 2px; color: #b30e16; text-align: center; }
        
        .contact-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
        .contact-method { padding: 15px; background: #060a09; border-radius: 4px; border: 1px solid #111a17; text-align: center; }
        .label { letter-spacing: 1px; font-size: 0.85rem; color: #8ba196; margin-bottom: 5px; text-transform: uppercase; }
        .value { font-size: 1.2rem; font-weight: bold; color: #dca642; word-break: break-all; }
        
        /* Form Styling */
        form { text-align: left; background: #060a09; padding: 30px; border-radius: 6px; border: 1px solid #111a17; }
        .form-heading { font-size: 1.3rem; color: #dca642; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; border-bottom: 1px solid #192420; padding-bottom: 5px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #cbd5d0; font-weight: bold; margin-bottom: 8px; font-size: 1rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; background: #0e1412; border: 1px solid #192420; color: #f4f4f2; border-radius: 4px; font-family: inherit; font-size: 1rem; transition: border-color 0.3s; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #dca642; }
        .sub-group { background: rgba(220, 166, 66, 0.03); padding: 15px; border-radius: 4px; border: 1px dashed #192420; }
        
        .btn-submit { display: block; width: 100%; background-color: #b30e16; color: #fff; padding: 14px; border-radius: 3px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; border: 1px solid #dca642; cursor: pointer; font-size: 1.1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .btn-submit:hover { background-color: #006351; color: #dca642; border-color: #b30e16; }
        .btn-submit:disabled { background-color: #333 !important; color: #777 !important; border-color: #444 !important; cursor: not-allowed; }
        
        footer { background-color: #060a09; text-align: center; padding: 40px 20px; font-size: 0.9rem; color: #52665c; border-top: 2px solid #b30e16; }
        @media (max-width: 768px) { .nav-links { display: none; } .contact-info-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo-box" id="logo-container"></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="songlist.html">Song List</a></li>
            <li><a href="reviews.html">Reviews</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
            <li><a href="shop.html">Shop</a></li>
        </ul>
    </nav>
    <div class="container">
        <section>
            <h2>Booking & Contact</h2>
            
            <div class="contact-info-grid">
                <div class="contact-method">
                    <div class="label">Booking Email</div>
                    <div class="value"><a href="#" id="email-target"></a></div>
                </div>
                <div class="contact-method">
                    <div class="label">Management Hotline</div>
                    <div class="value" id="phone-target"></div>
                </div>
            </div>

            <form id="booking-form" action="https://formspree.io/f/mgoqylob" method="POST">
                <div class="form-heading">Send A Booking Inquiry</div>
                
                <div class="form-group">
                    <label for="location">Where do you want us to entertain?</label>
                    <input type="text" id="location" name="Venue/Location" placeholder="City, State or Venue Name" required>
                </div>
                
                <div class="form-group">
                    <label for="size">Size of event</label>
                    <input type="text" id="size" name="Event Size" placeholder="Estimated guest count (e.g., 150 people)" required>
                </div>
                
                <div class="form-group">
                    <label for="budget">Budget</label>
                    <input type="text" id="budget" name="Budget Range" placeholder="Approximate performance budget ($)" required>
                </div>
                
                <div class="form-group sub-group">
                    <label style="color: #dca642; font-size: 1.1rem; border-bottom: 1px solid #192420; padding-bottom: 5px; margin-bottom: 12px;">Who do we contact?</label>
                    
                    <div class="form-group">
                        <label for="contact-name">Contact Person Name</label>
                        <input type="text" id="contact-name" name="Contact Name" placeholder="Full Name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="contact-email">Email Address</label>
                        <input type="email" id="contact-email" name="_replyto" placeholder="yourname@email.com" required>
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="contact-phone">Phone Number</label>
                        <input type="tel" id="contact-phone" name="Contact Phone" placeholder="555-555-5555" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="details">Any details you can provide</label>
                    <textarea id="details" name="Event Details" rows="5" placeholder="Tell us about the event vibe, date options, dress codes, music preferences..." required></textarea>
                </div>
                
                <button type="submit" id="submit-btn" class="btn-submit">Submit Booking Request</button>
            </form>
            
        </section>
    </div>
    <footer><p>© 2026 Dance Hall Hooligans. All rights reserved.</p></footer>
    
    <script>
        // 1. Load data from JSON
        fetch('data.json').then(res => res.json()).then(data => {
            const dirs = data.directories || { logos: "" };
            document.getElementById('logo-container').innerHTML = `<img src="${dirs.logos}${data.logoFile}" class="logo-img"><span class="logo-text">Dance Hall Hooligans</span>`;
            
            document.getElementById('email-target').innerText = data.contact.bookingEmail;
            document.getElementById('email-target').href = `mailto:${data.contact.bookingEmail}`;
            document.getElementById('phone-target').innerText = data.contact.managementPhone;
        });

        // 2. Intercept Form Submission for seamless background delivery + alert popup
        const form = document.getElementById('booking-form');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Stop page redirection
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Sending Request...";

            // Package the data up for Formspree
            const formData = new FormData(form);

            fetch(form.action, {
                method: form.method,
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    // Show custom confirmation alert window
                    alert("Thank you for contacting Dance Hall Hooligans. We will get back with you as soon as possible.");
                    form.reset(); // Erase all input fields completely
                } else {
                    alert("Oops! There was a problem submitting your form. Please try again.");
                }
            })
            .catch(error => {
                alert("Network error. Please check your internet connection and try again.");
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Booking Request";
            });
        });
    </script>
</body>
</html>
